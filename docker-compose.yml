version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    restart: always

  client:
    build: ./client
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
    depends_on:
      - server
    restart: always
