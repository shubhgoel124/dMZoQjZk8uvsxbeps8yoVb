name: QuickChat CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # Backend Checks
    - name: Backend - Install Dependencies
      run: |
        cd server
        npm install

    - name: Backend - Build Check
      run: |
        cd server
        node --check server.js

    # Frontend Checks
    - name: Frontend - Install Dependencies
      run: |
        cd client
        npm install

    - name: Frontend - Lint
      run: |
        cd client
        npm run lint

    - name: Frontend - Build
      run: |
        cd client
        npm run build
